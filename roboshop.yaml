- name: create ec2 instance 
  host: localhost
  connection: local
  vars: 
    instance: ["mangodb", "redis", "mysql", "rabbitmq"]
    domain_name: yesdasunfiltered.fun
    ami_id: ami-0055977a6e828a4f4
  tasks: 
   - name: create ec2 instance
     amazon.aws.ec2_instances: 
       name: "roboshop-{{ item }}"
       image_id: "{{ ami_id }}"
       instnace_type: t3.micro
       region: us-east-1
       security_groups:
        - ssh-my-system
     loop: "{{ instance }}"
     when: action == "create"
         

   