- name: create ec2 instance 
  hosts: localhost
  connection: local
  vars: 
    instance: ["mangodb", "redis", "mysql", "rabbitmq"]
    domain_name: yesdasunfiltered.fun
    ami_id: ami-0055977a6e828a4f4
  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        region: us-east-1
        security_groups:
          - ssh-my-system
        state: present
      loop: "{{ instances }}"
      when: action == "create"
         

   